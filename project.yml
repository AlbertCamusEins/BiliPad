name: BiliPad

options:
  bundleIdPrefix: com.bilipad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  BiliPad:
    type: application
    platform: iOS
    sources:
      - path: BiliPad
        excludes:
          - Resources
      - path: BiliPad/Resources/controller-bridge.js
        group: BiliPad/Resources
        buildPhase: resources
      - path: BiliPad/Resources/focus-navigation.js
        group: BiliPad/Resources
        buildPhase: resources
      - path: BiliPad/Resources/bilipad.css
        group: BiliPad/Resources
        buildPhase: resources
    info:
      path: BiliPad/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilipad.app
        PRODUCT_NAME: BiliPad
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

schemes:
  BiliPad:
    build:
      targets:
        BiliPad: all
    run:
      config: Debug
    archive:
      config: Release
